<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pharosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <radialGradient id="lightBeam" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#051224" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#071326" />
  <circle cx="50" cy="45" r="32" fill="url(#lightBeam)" />
  <!-- Lighthouse Tower Silhouette -->
  <polygon points="44,72 56,72 54,42 46,42" fill="#132342" stroke="url(#pharosGrad)" stroke-width="2" />
  <!-- Beacon Top -->
  <polygon points="42,42 58,42 54,34 46,34" fill="#00F2FE" />
  <!-- Light Beam Rays -->
  <polygon points="50,38 20,24 22,28" fill="#00F2FE" opacity="0.7" />
  <polygon points="50,38 80,24 78,28" fill="#00F2FE" opacity="0.7" />
  <!-- Center Star Flare -->
  <circle cx="50" cy="38" r="4" fill="#FFFFFF" />
</svg>
