<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>
    <linearGradient id="goldVpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0B0F19" />
  <!-- Circuit microchip lines -->
  <line x1="20" y1="50" x2="35" y2="50" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="80" y1="50" x2="65" y2="50" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="20" x2="50" y2="35" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="80" x2="50" y2="65" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Outer chip frame -->
  <rect x="32" y="32" width="36" height="36" rx="8" fill="#131B2E" stroke="#00F2FE" stroke-width="2" />
  <!-- Silicon core -->
  <rect x="38" y="38" width="24" height="24" rx="4" fill="url(#goldVpu)" />
  <!-- Center letter F -->
  <path d="M45 43 H55 V47 H49 V49 H54 V53 H49 V57 H45 Z" fill="#0B0F19" />
